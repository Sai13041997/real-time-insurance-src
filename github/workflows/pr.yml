name: PR

on:
  pull_request:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        name: Enumerate all lambdas
        shell: bash
        run: |
          set -euo pipefail
          json='[]'
          while IFS= read -r name; do
            [[ -z "${name}" ]] && continue
            json="$(jq -c --arg v "${name}" '. + [$v]' <<< "${json}")"
          done < <(find lambdas -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"

  package:
    runs-on: ubuntu-latest
    needs: build-matrix
    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Package lambda
        run: |
          chmod +x scripts/package_lambda.sh
          ./scripts/package_lambda.sh "${{ matrix.lambda }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lambda }}
          path: .artifacts/${{ matrix.lambda }}.zip
          if-no-files-found: error

name: PR

on:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: matrix
        name: Detect changed lambdas and build matrix
        shell: bash
        run: |
          set -euo pipefail

          # Get newline-separated lambda folder names
          CHANGED_LINES="$(python3 scripts/changed_lambdas.py --base-ref origin/main || true)"

          if [[ -z "${CHANGED_LINES}" ]]; then
            echo "No lambda changes detected."
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Convert to JSON array without any heredocs (uses jq)
          json='[]'
          while IFS= read -r line; do
            [[ -z "${line}" ]] && continue
            json="$(jq -c --arg v "${line}" '. + [$v]' <<< "${json}")"
          done <<< "${CHANGED_LINES}"

          echo "Matrix JSON: ${json}"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"

  package:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Package lambda
        run: |
          chmod +x scripts/package_lambda.sh
          ./scripts/package_lambda.sh "${{ matrix.lambda }}"

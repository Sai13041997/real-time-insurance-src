name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      env: ${{ steps.env.outputs.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: env
        name: Determine environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            # Default: pushes to main deploy to dev. Promote to prod via workflow_dispatch.
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

      - id: matrix
        name: Detect changed lambdas and build matrix
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ github.event.before }}"
          if [[ -z "${BASE}" || "${BASE}" == "0000000000000000000000000000000000000000" ]]; then
            BASE="origin/main~1"
          fi

          CHANGED_LINES="$(python3 scripts/changed_lambdas.py --base-ref "${BASE}" || true)"

          if [[ -z "${CHANGED_LINES}" ]]; then
            echo "No lambda changes detected."
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json='[]'
          while IFS= read -r line; do
            [[ -z "${line}" ]] && continue
            json="$(jq -c --arg v "${line}" '. + [$v]' <<< "${json}")"
          done <<< "${CHANGED_LINES}"

          echo "Matrix JSON: ${json}"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' }}
    environment: ${{ needs.detect-changes.outputs.env }}

    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Package lambda
        run: |
          chmod +x scripts/package_lambda.sh
          ./scripts/package_lambda.sh "${{ matrix.lambda }}"

      - name: Deploy lambda code
        run: |
          chmod +x scripts/deploy_lambda.sh
          ./scripts/deploy_lambda.sh "${{ needs.detect-changes.outputs.env }}" "${{ matrix.lambda }}"

  apigw-redeploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy]
    if: ${{ needs.detect-changes.outputs.matrix != '[]' }}
    environment: ${{ needs.detect-changes.outputs.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Redeploy REST API stage (always)
        run: |
          chmod +x scripts/apigw_redeploy.sh
          ./scripts/apigw_redeploy.sh "${{ needs.detect-changes.outputs.env }}"

name: Deploy

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read
  deployments: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      env: ${{ steps.env.outputs.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: env
        name: Determine environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            # Default: pushes to main deploy to dev. Promote to prod via workflow_dispatch.
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

      - id: matrix
        name: Detect changed lambdas and build matrix
        shell: bash
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          TARGET_ENV="${{ steps.env.outputs.env }}"

          # Derive BASE from deployment state for the target environment.
          BASE=""
          DEPLOYMENTS_JSON="$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/deployments?environment=${TARGET_ENV}&per_page=50")"

          while IFS='|' read -r dep_id dep_sha; do
            [[ -z "${dep_id}" || -z "${dep_sha}" ]] && continue

            state="$(curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/deployments/${dep_id}/statuses?per_page=1" \
              | jq -r '.[0].state // empty')"

            if [[ "${state}" == "success" ]]; then
              BASE="${dep_sha}"
              break
            fi
          done < <(jq -r '.[] | "\(.id)|\(.sha)"' <<< "${DEPLOYMENTS_JSON}")

          if [[ -z "${BASE}" ]]; then
            echo "No prior successful deployment found for env=${TARGET_ENV}; selecting all lambdas from current branch."
            CHANGED_LINES="$(find lambdas -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort || true)"
          else
            echo "Using base from latest successful deployment for env=${TARGET_ENV}: ${BASE}"
            CHANGED_LINES="$(python3 scripts/changed_lambdas.py --base-ref "${BASE}" || true)"
          fi

          if [[ -z "${CHANGED_LINES}" ]]; then
            echo "No lambda changes detected."
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json='[]'
          while IFS= read -r line; do
            [[ -z "${line}" ]] && continue
            json="$(jq -c --arg v "${line}" '. + [$v]' <<< "${json}")"
          done <<< "${CHANGED_LINES}"

          echo "Matrix JSON: ${json}"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' }}
    environment: ${{ needs.detect-changes.outputs.env }}
    env:
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET_NAME }}
      ARTIFACT_ROLE_ARN: ${{ vars.ARTIFACT_ROLE }}

    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Package lambda
        run: |
          chmod +x scripts/package_lambda.sh
          ./scripts/package_lambda.sh "${{ matrix.lambda }}"

      - name: Configure AWS credentials for artifact upload (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ARTIFACT_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload lambda artifact to durable storage
        run: |
          set -euo pipefail

          if [[ -z "${ARTIFACT_BUCKET:-}" || -z "${ARTIFACT_ROLE_ARN:-}" ]]; then
            echo "ARTIFACT_BUCKET_NAME and ARTIFACT_ROLE org vars are required." >&2
            exit 1
          fi

          ARTIFACT_KEY="${{ github.event.repository.name }}/${{ needs.detect-changes.outputs.env }}/${{ matrix.lambda }}/Build${{ github.run_number }}/${{ matrix.lambda }}.zip"
          LOCAL_ZIP=".artifacts/${{ matrix.lambda }}.zip"

          aws s3 cp "${LOCAL_ZIP}" "s3://${ARTIFACT_BUCKET}/${ARTIFACT_KEY}"

          echo "ARTIFACT_KEY=${ARTIFACT_KEY}" >> "$GITHUB_ENV"
          echo "Uploaded durable artifact: s3://${ARTIFACT_BUCKET}/${ARTIFACT_KEY}"

      - name: Configure AWS credentials for lambda deploy (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy lambda code
        run: |
          chmod +x scripts/deploy_lambda.sh
          ./scripts/deploy_lambda.sh "${{ needs.detect-changes.outputs.env }}" "${{ matrix.lambda }}" "${ARTIFACT_BUCKET}" "${ARTIFACT_KEY}"

  apigw-redeploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy]
    if: ${{ needs.detect-changes.outputs.matrix != '[]' }}
    environment: ${{ needs.detect-changes.outputs.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Redeploy REST API stage (always)
        run: |
          chmod +x scripts/apigw_redeploy.sh
          ./scripts/apigw_redeploy.sh "${{ needs.detect-changes.outputs.env }}"
